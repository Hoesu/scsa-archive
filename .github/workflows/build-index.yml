# main 에 문제/풀이가 머지되면 PROBLEMS.md 를 다시 만들어 index 브랜치에 커밋한다.
# main 은 보호 규칙 때문에 봇이 직접 커밋할 수 없어서 별도 브랜치를 쓴다. (docs/admin-setup.md 참고)
name: build-index

on:
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "scripts/build_index.py"
      - "scripts/common.py"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PROBLEMS.md 생성
        run: python scripts/build_index.py --output "$RUNNER_TEMP/PROBLEMS.md"

      - name: index 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin index > /dev/null; then
            git fetch --depth=1 origin index
            git checkout -B index FETCH_HEAD
          else
            git switch --orphan index
          fi

          cp "$RUNNER_TEMP/PROBLEMS.md" PROBLEMS.md
          git add PROBLEMS.md
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "[문서] PROBLEMS.md 갱신 (${GITHUB_SHA::7})"
          git push origin index

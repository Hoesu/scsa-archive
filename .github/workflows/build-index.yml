# main 에 문제/풀이가 머지되면 PROBLEMS.md 를 다시 만들어 커밋한다.
# 브랜치 보호 규칙(ruleset)을 쓰는 경우 docs/admin-setup.md 의 "자동 커밋 허용" 항목을 확인하세요.
name: build-index

on:
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "scripts/build_index.py"
      - "scripts/common.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PROBLEMS.md 생성
        run: python scripts/build_index.py

      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- PROBLEMS.md; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROBLEMS.md
          git commit -m "docs: PROBLEMS.md 자동 갱신 [skip ci]"
          git pull --rebase origin main
          git push
